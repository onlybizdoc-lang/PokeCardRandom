<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carte Random">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-192.png">
<title>Carte Random</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1d2029;
    --text: #f2f3f5;
    --muted: #9aa0ad;
    --accent: #ffcb05;
    --accent-text: #1a1a1a;
    --radius: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100dvh; padding: calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 150px); }
  body { display: flex; flex-direction: column; }
  body.locked { overflow: hidden; }
  header { display: flex; align-items: baseline; justify-content: flex-end; margin: 0 2px 8px; max-width: 720px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  #count { font-size: 12px; color: var(--muted); text-align: right; }
  #grid { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 720px; margin: auto; }
  .card { position: relative; aspect-ratio: 63 / 88; border-radius: var(--radius); background: var(--panel); overflow: hidden; border: 3px solid var(--rc, transparent); padding: 0; cursor: pointer; transition: border-color .3s, box-shadow .3s; }
  .card[class*="r-"]:not(.r-common):not(.r-uncommon) { box-shadow: 0 0 12px var(--rc); }
  .card.r-secret { background: linear-gradient(120deg, #ff4fd8, #ffcb05, #3be8ff, #9b6bff, #ff4fd8) border-box; background-size: 300% 300%; animation: rainbow 4s linear infinite; }
  @keyframes rainbow { to { background-position: 300% 0; } }
  .r-common { --rc: #8b92a3; } .r-uncommon { --rc: #3ecf6e; } .r-rare { --rc: #3b9bff; }
  .r-holo { --rc: #a463ff; } .r-ultra { --rc: #ffcb05; } .r-secret { --rc: #ff4fd8; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .25s; }
  .card img.ok { opacity: 1; }
  .card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.06) 50%, transparent 70%); background-size: 200% 100%; animation: shimmer 1.2s infinite; pointer-events: none; }
  .card.loaded::after { display: none; }
  .lang { position: absolute; top: 4px; right: 4px; font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 6px; background: rgba(0,0,0,.7); color: #fff; letter-spacing: .3px; pointer-events: none; }
  @keyframes shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  #tfilters { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; max-width: 520px; margin: 0 auto; width: 100%; }
  .tchip { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-width: 0; border: 1.5px solid #343846; background: var(--panel); color: var(--muted); border-radius: 12px; padding: 8px 1px 7px; font-size: 9.5px; letter-spacing: -.1px; font-weight: 700; line-height: 1; white-space: nowrap; cursor: pointer; }
  .tchip::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--rc, var(--muted)); }
  .tchip.r-secret::before { background: linear-gradient(120deg, #ff4fd8, #ffcb05, #3be8ff); }
  .tchip.on { color: var(--text); border-color: var(--rc, var(--accent)); background: color-mix(in srgb, var(--rc, var(--accent)) 22%, var(--panel)); }
  .tchip.all.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .tchip.all::before { background: conic-gradient(#ff4fd8, #ffcb05, #3ecf6e, #3b9bff, #a463ff, #ff4fd8); }
  #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 70px); transform: translateX(-50%); z-index: 8; background: rgba(0,0,0,.85); color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #toast.on { opacity: 1; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: var(--full, 100%); z-index: 5; pointer-events: none; }
  #filters { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 84px); z-index: 5; display: flex; flex-wrap: nowrap; justify-content: center; gap: 8px; padding: 0 12px; pointer-events: none; }
  #filters .chip { pointer-events: auto; box-shadow: 0 2px 10px rgba(0,0,0,.45); }
  .chip { flex: none; border: 1px solid #343846; background: var(--panel); color: var(--text); border-radius: 999px; padding: 6px 14px; font-size: 20px; line-height: 1.2; font-weight: 600; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .chip:disabled { opacity: .45; }
  #status { text-align: center; color: var(--muted); font-size: 14px; margin: 24px 8px; }
  #refresh { pointer-events: auto; position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 18px); border: 0; border-radius: 999px; padding: 16px 36px; font-size: 17px; font-weight: 700; background: var(--accent); color: var(--accent-text); box-shadow: 0 6px 24px rgba(0,0,0,.45); cursor: pointer; display: flex; align-items: center; gap: 8px; }
  #refresh:active { transform: translateX(-50%) scale(.96); }
  #refresh:disabled { opacity: .6; }
  #refresh svg { width: 20px; height: 20px; }
  #refresh.spin svg { animation: spin .6s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Carta a schermo intero */
  #modal { position: fixed; top: 0; left: 0; right: 0; height: var(--full, 100%);  background: #000; display: none; z-index: 10; touch-action: none; }
  #modal.open { display: block; }
  #bg { position: absolute; inset: -60px; background-size: cover; background-position: center; filter: blur(28px); transform: scale(1.1); }
  #shade { position: absolute; inset: 0; background: rgba(0,0,0,.6); }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px); }
  #big { border: 4px solid var(--rc, transparent); box-shadow: 0 0 22px var(--rc, transparent); max-width: 100%; max-height: 100%; border-radius: 16px; transform-origin: center; will-change: transform; user-select: none; -webkit-user-drag: none; }
  #info { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 16px calc(env(safe-area-inset-bottom) + 16px); background: linear-gradient(transparent, rgba(0,0,0,.85) 45%); text-align: center; transition: opacity .2s; }
  #modal.clean #info, #modal.clean .top { opacity: 0; pointer-events: none; }
  #info .name { font-size: 20px; font-weight: 700; }
  #info .meta { font-size: 14px; color: #c4c8d0; margin-top: 4px; line-height: 1.5; }
  #info a { color: var(--accent); font-size: 14px; display: inline-block; margin-top: 8px; }
  .top { position: absolute; top: calc(env(safe-area-inset-top) + 10px); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; transition: opacity .2s; z-index: 2; }
  .top span { font-size: 13px; color: #c4c8d0; background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 999px; }
  #close { background: rgba(255,255,255,.15); color: #fff; border: 0; width: 42px; height: 42px; border-radius: 50%; font-size: 24px; line-height: 1; cursor: pointer; }

  /* Schermata iniziale */
  @font-face { font-family: 'Logo'; src: url(luckiest.ttf) format('truetype'); font-display: swap; }
  #splash { position: fixed; top: 0; left: 0; right: 0; height: calc(100% + var(--extra, 0px)); z-index: 30; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 24px calc(24px + var(--extra, 0px)); transition: opacity .4s; }
  html.splashing, html.splashing body { background: #000; }
  #splash.hide { opacity: 0; pointer-events: none; }
  #wall { position: absolute; inset: -40px; display: flex; gap: 10px; justify-content: center; filter: blur(4px); transform: scale(1.1); }
  #wall .col { flex: 1; max-width: 160px; display: flex; flex-direction: column; gap: 10px; animation: up 40s linear infinite; }
  #wall .col:nth-child(even) { animation-name: down; }
  #wall .col:nth-child(3n) { animation-duration: 52s; }
  #wall .col:nth-child(3n+1) { animation-duration: 34s; }
  #wall img { opacity: 0; transition: opacity .4s; width: 100%; aspect-ratio: 63 / 88; border-radius: 8px; display: block; background: var(--panel); }
  @keyframes up { to { transform: translateY(-50%); } }
  @keyframes down { from { transform: translateY(-50%); } to { transform: translateY(0); } }
  #wall img.ok { opacity: 1; }
  #splash .shade { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
  #go { position: relative; border: 0; border-radius: 999px; padding: 18px 40px; font-size: 19px; font-weight: 800; background: var(--accent); color: var(--accent-text); cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  #go:active { transform: scale(.96); }
  #go:disabled { opacity: .6; }
  #hint { position: relative; max-width: 300px; margin: 6px 0 0; text-align: center; color: #c4c8d0; font-size: 12.5px; line-height: 1.45; display: none; }
  #hint b { color: #fff; }
  #logo { position: relative; margin: 0; font-family: 'Logo', Impact, sans-serif; font-weight: 400; font-size: clamp(40px, 12vw, 88px); line-height: 1; text-align: center; color: #ffcb05; letter-spacing: 2px; -webkit-text-stroke: 8px #3b4cca; paint-order: stroke fill; text-shadow: 0 6px 0 #1f2a80, 0 10px 24px rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="tfilters"></div>
<div id="grid"></div>
<div id="status">Carico le carte…</div>

<div id="bar">
  <div id="filters"></div>
  <button id="refresh" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    Aggiorna
  </button>
</div>

<div id="toast"></div>

<div id="modal" role="dialog" aria-modal="true">
  <div id="bg"></div><div id="shade"></div>
  <div id="stage"><img id="big" alt="" draggable="false"></div>
  <div class="top"><span id="pos"></span><button id="close" aria-label="Chiudi">×</button></div>
  <div id="info"></div>
</div>

<div id="splash">
  <div id="wall"></div><div class="shade"></div>
  <h1 id="logo">PokèRandom</h1>
  <button id="go" disabled>Carico le carte…</button>
  <p id="hint">Per usarla a <b>schermo intero</b>: tocca Condividi → <b>Aggiungi alla schermata Home</b> e lascia attivo <b>«Apri come app web»</b>.</p>
</div>

<script>
// App aggiunta alla Home (iOS): l'altezza "fissa" può fermarsi sopra la barra home. Uso l'altezza vera dello schermo.
(function () {
  const standalone = navigator.standalone || (matchMedia && matchMedia('(display-mode: standalone)').matches);
  const set = () => { const st = document.documentElement.style; st.setProperty('--full', standalone ? innerHeight + 'px' : '100%'); st.setProperty('--extra', '0px'); };
  if (!standalone && /iPhone|iPad|iPod/.test(navigator.userAgent)) document.addEventListener('DOMContentLoaded', () => { const h = document.getElementById('hint'); if (h) h.style.display = 'block'; });
  set(); addEventListener('resize', set); addEventListener('orientationchange', () => setTimeout(set, 200));
})();
const API = 'https://api.tcgdex.net/v2';
const ASSETS = 'https://assets.tcgdex.net/';
// Lingue incluse (il cinese di TCGdex con immagini è quello tradizionale)
const LANGS = { 'en': 'EN', 'it': 'IT', 'ja': 'JP', 'zh-tw': 'CN' };
const LANG_NAMES = { 'en': 'Inglese', 'it': 'Italiano', 'ja': 'Giapponese', 'zh-tw': 'Cinese' };
const FLAGS = { 'en': '🇬🇧', 'it': '🇮🇹', 'ja': '🇯🇵', 'zh-tw': '🇨🇳' };
const CACHE_DAYS = 7;
// Escludo le carte del gioco Pokémon TCG Pocket (set A1, A2a, B1, P-A… e le loro rarità): solo carte fisiche
const isPocket = id => /^(?:[AB]\d+[a-z]?|P-[A-Z])-/i.test(id);
const POCKET_RARITY = /^(one|two|three|four) (diamond|star|shiny)$|^crown$/i;
const N = 9;

const $ = id => document.getElementById(id);
const grid = $('grid'), statusEl = $('status'), btn = $('refresh');
const modal = $('modal'), big = $('big'), info = $('info'), pos = $('pos');

// pools[lang] = [[id, percorsoImmagine], ...]
const pools = {};
let total = 0;
let bag = null, bagPos = 0;
let hand = [];      // le 9 carte mostrate
let current = 0;    // carta aperta a schermo intero
let active = new Set(); // lingue scelte nel filtro; vuoto = tutte

/* ---------- archivio locale (IndexedDB) ---------- */
function db() {
  return new Promise((ok, ko) => {
    const r = indexedDB.open('carte', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('langs');
    r.onsuccess = () => ok(r.result);
    r.onerror = () => ko(r.error);
  });
}
async function idbGet(k) {
  try { const d = await db(); return await new Promise(ok => { const r = d.transaction('langs').objectStore('langs').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); }); }
  catch (e) { return null; }
}
async function idbSet(k, v) {
  try { const d = await db(); d.transaction('langs', 'readwrite').objectStore('langs').put(v, k); } catch (e) {}
}

async function loadLang(lang) {
  const c = await idbGet(lang);
  if (c && Date.now() - c.t < CACHE_DAYS * 864e5) return c.d.filter(x => !isPocket(x[0]));
  const res = await fetch(`${API}/${lang}/cards`);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const prefix = `${ASSETS}${lang}/`;
  const d = (await res.json()).filter(x => x.image && !isPocket(x.id)).map(x => [x.id, x.image.replace(prefix, '')]);
  idbSet(lang, { t: Date.now(), d });
  return d;
}


/* ---------- rarità → bordo ---------- */
const RARITIES = {
  common:   ['Common'],
  uncommon: ['Uncommon'],
  rare:     ['Rare', 'Rare PRIME', 'Rare Shining', 'Black White Rare', 'Character Rare', 'Pikachu Rare', 'Prism Star'],
  holo:     ['Holo Rare', 'Rare Holo', 'Rare Holo LV.X', 'Double rare', 'Holo Rare V', 'Holo Rare VMAX', 'Holo Rare VSTAR', 'LEGEND', 'Triple Rare', 'Character Super Rare'],
  ultra:    ['Ultra Rare', 'Illustration rare', 'Shiny rare', 'Shiny rare V', 'Shiny rare VMAX', 'Shiny Ultra Rare', 'Radiant Rare', 'Amazing Rare', 'ACE SPEC Rare', 'Full Art Trainer', 'Classic Collection', 'Futuristic Rare', 'RGB Rare', 'Mega Attack Rare'],
  secret:   ['Secret Rare', 'Hyper rare', 'Special illustration rare', 'Mega Hyper Rare']
};
const TIER_LABELS = { common: 'Comuni', uncommon: 'N.C.', rare: 'Rare', holo: 'Holo', ultra: 'Ultra', secret: 'Segrete' };
const RARITY_TIER = {};
for (const t in RARITIES) for (const v of RARITIES[t]) RARITY_TIER[v.toLowerCase()] = t;
function tierOf(r) {
  const s = String(r || '').toLowerCase().trim();
  if (!s || s === 'none') return null;
  if (RARITY_TIER[s]) return RARITY_TIER[s];
  // riserva: parole chiave (anche per rarità non in elenco o tradotte)
  if (/secret|hyper|segret|crown|special illustration|シークレット|スペシャルアート|ハイパー/.test(s)) return 'secret';
  if (/ultra|illustration|art rare|アート|ウルトラ|shiny|radiant|amazing|ace spec/.test(s)) return 'ultra';
  if (/holo|double|doppia|ダブル|スーパー|super|mega|vmax|vstar|ホロ/.test(s)) return 'holo';
  if (/rare|rara|レア|稀有/.test(s)) return 'rare';
  if (/uncommon|non comune|アンコモン/.test(s)) return 'uncommon';
  if (/common|comune|コモン|普通/.test(s)) return 'common';
  return null;
}
const details = new Map(); // "lang/id" → promessa con i dati della carta
function getDetail(c) {
  const k = c.lang + '/' + c.id;
  if (!details.has(k)) details.set(k, fetch(`${API}/${c.lang}/cards/${encodeURIComponent(c.id)}`).then(r => { if (!r.ok) throw 0; return r.json(); }).catch(() => { details.delete(k); return null; }));
  return details.get(k);
}
const TIERS = ['common', 'uncommon', 'rare', 'holo', 'ultra', 'secret'];
function paintTier(el, tier) {
  el.classList.remove(...TIERS.map(t => 'r-' + t));
  if (tier) el.classList.add('r-' + tier);
}

/* ---------- estrazione casuale ---------- */
const fpools = {};            // carte filtrate per rarità: fpools[lang] = [[id, percorso], ...]
let tierActive = new Set();   // rarità scelte; vuoto = tutte
const P = () => tierActive.size ? fpools : pools;
const activeLangs = () => Object.keys(P()).filter(l => !active.size || active.has(l));
function rebuildBag() {
  total = activeLangs().reduce((s, l) => s + P()[l].length, 0);
  bag = new Uint32Array(total);
  for (let i = 0; i < total; i++) bag[i] = i;
  for (let i = total - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = bag[i]; bag[i] = bag[j]; bag[j] = t; }
  bagPos = 0;
}
function pick() {
  if (!bag || bagPos >= bag.length) rebuildBag();
  let i = bag[bagPos++];
  for (const lang of activeLangs()) {
    const pool = P()[lang];
    if (i < pool.length) { const [id, path] = pool[i]; return { lang, id, path }; }
    i -= pool.length;
  }
}
const img = (c, q) => `${ASSETS}${c.lang}/${c.path}/${q}.webp`;

function deal() {
  btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin');
  grid.innerHTML = '';
  hand = [];
  for (let k = 0; k < N; k++) {
    const slot = k;
    hand[slot] = pick();
    const b = document.createElement('button');
    b.className = 'card';
    const badge = document.createElement('span');
    badge.className = 'lang';
    const im = new Image();
    im.alt = ''; im.decoding = 'async';
    const show = (tries = 0) => {
      const c = hand[slot];
      badge.textContent = LANGS[c.lang]; im.src = img(c, 'low');
      paintTier(b, null);
      getDetail(c).then(d => {
        if (hand[slot] !== c) return;
        // rete di sicurezza: carte Pocket mai mostrate
        if (d && POCKET_RARITY.test(d.rarity || '') && tries < 40) { hand[slot] = pick(); show(tries + 1); return; }
        const t = tierOf(d && d.rarity);
        // rete di sicurezza: se la carta non è della rarità scelta, ne pesco un'altra
        if (d && tierActive.size && !tierActive.has(t) && tries < 40) { hand[slot] = pick(); show(tries + 1); return; }
        paintTier(b, t);
      });
    };
    im.onload = () => { im.classList.add('ok'); b.classList.add('loaded'); };
    im.onerror = () => { hand[slot] = pick(); show(); }; // immagine mancante → un'altra carta
    show();
    b.append(im, badge);
    b.addEventListener('click', () => openCard(slot));
    grid.appendChild(b);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- schermo intero ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
let z = { s: 1, x: 0, y: 0 };
function applyZoom() { big.style.transform = `translate(${z.x}px, ${z.y}px) scale(${z.s})`; }
function resetZoom() { z = { s: 1, x: 0, y: 0 }; applyZoom(); }

async function openCard(i) {
  current = (i + N) % N;
  const c = hand[current];
  resetZoom();
  modal.classList.add('open'); modal.classList.remove('clean');
  document.body.classList.add('locked');
  pos.textContent = `${current + 1} / ${N} · ${LANGS[c.lang]}`;
  big.src = img(c, 'low');
  $('bg').style.backgroundImage = `url("${img(c, 'low')}")`;
  const hi = new Image();
  hi.onload = () => { if (hand[current] === c) big.src = hi.src; };
  hi.src = img(c, 'high');
  info.innerHTML = '<div class="meta">…</div>';
  paintTier(big, null);
  try {
    const d = await getDetail(c);
    if (!d) throw 0;
    if (hand[current] !== c) return;
    paintTier(big, tierOf(d.rarity));
    const set = d.set || {};
    const tot = set.cardCount ? (set.cardCount.official || set.cardCount.total) : '';
    const q = encodeURIComponent(`${d.name} ${set.name || ''}`);
    info.innerHTML = `
      <div class="name">${esc(d.name)}</div>
      <div class="meta">${esc(set.name)} · ${esc(d.localId)}${tot ? '/' + esc(tot) : ''}${d.rarity ? ' · ' + esc(d.rarity) : ''}</div>
      <a href="https://www.cardmarket.com/it/Pokemon/Products/Search?searchString=${q}" target="_blank" rel="noopener">Cerca su Cardmarket →</a>`;
  } catch (e) { if (hand[current] === c) info.innerHTML = ''; }
}
function closeModal() { modal.classList.remove('open'); document.body.classList.remove('locked'); big.removeAttribute('src'); paintTier(big, null); $('bg').style.backgroundImage = ''; }
$('close').addEventListener('click', e => { e.stopPropagation(); closeModal(); });
document.addEventListener('keydown', e => {
  if (!modal.classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowRight') openCard(current + 1);
  if (e.key === 'ArrowLeft') openCard(current - 1);
});

// Gesti: tocco = mostra/nascondi info, doppio tocco = zoom, pizzico = zoom,
// trascina = sposta (se ingrandita) o cambia carta (scorri a destra/sinistra), scorri giù = chiudi
const pts = new Map();
let start = null, pinch = null, lastTap = 0, moved = false;
modal.addEventListener('pointerdown', e => {
  if (e.target.closest('a, button')) return;
  modal.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = false;
  if (pts.size === 1) start = { x: e.clientX, y: e.clientY, zx: z.x, zy: z.y, t: Date.now() };
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: z.s };
  }
});
modal.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2 && pinch) {
    const [a, b] = [...pts.values()];
    z.s = Math.min(5, Math.max(1, pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
    if (z.s === 1) { z.x = 0; z.y = 0; }
    moved = true; applyZoom();
  } else if (pts.size === 1 && start) {
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
    if (z.s > 1) { z.x = start.zx + dx; z.y = start.zy + dy; applyZoom(); }
    else { big.style.transform = `translate(${dx}px, ${Math.max(0, dy)}px)`; }
  }
});
function endPointer(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (pts.size === 1) { pinch = null; const [p] = [...pts.values()]; start = { x: p.x, y: p.y, zx: z.x, zy: z.y, t: Date.now() }; return; }
  if (pts.size > 0 || !start) return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y;
  if (!moved) {
    const now = Date.now();
    if (now - lastTap < 300) { // doppio tocco
      if (z.s > 1) resetZoom(); else { z.s = 2.5; applyZoom(); }
      lastTap = 0;
    } else {
      lastTap = now;
      setTimeout(() => { if (lastTap === now) modal.classList.toggle('clean'); }, 300);
    }
  } else if (z.s === 1) {
    if (dx < -60 && Math.abs(dx) > Math.abs(dy)) openCard(current + 1);
    else if (dx > 60 && Math.abs(dx) > Math.abs(dy)) openCard(current - 1);
    else if (dy > 100) closeModal();
    else applyZoom();
  }
  start = null; pinch = null;
}
modal.addEventListener('pointerup', endPointer);
modal.addEventListener('pointercancel', endPointer);


/* ---------- filtro rarità ---------- */
try { tierActive = new Set((JSON.parse(localStorage.getItem('filtro-rarita')) || []).filter(t => RARITIES[t])); } catch (e) {}
const listCache = new Map();
async function loadRarity(lang, value) {
  const k = lang + '|' + value;
  if (!listCache.has(k)) {
    listCache.set(k, fetch(`${API}/${lang}/cards?rarity=eq:${encodeURIComponent(value)}`)
      .then(r => r.ok ? r.json() : [])
      .then(a => Array.isArray(a) ? a : [])
      .catch(() => { listCache.delete(k); return []; }));
  }
  return listCache.get(k);
}
// costruisce fpools per le rarità scelte; se il filtro dell'API non risponde come previsto, ripiega su tutte le carte (la rete di sicurezza in show() fa il resto)
async function loadFiltered(tiers) {
  const out = {};
  await Promise.all(Object.keys(pools).map(async lang => {
    const values = [...tiers].flatMap(t => RARITIES[t]);
    const lists = await Promise.all(values.map(v => loadRarity(lang, v)));
    const prefix = `${ASSETS}${lang}/`;
    const seen = new Set(), d = [];
    for (const l of lists) for (const x of l) if (x.image && !isPocket(x.id) && !seen.has(x.id)) { seen.add(x.id); d.push([x.id, x.image.replace(prefix, '')]); }
    out[lang] = d.length > pools[lang].length * 0.9 ? pools[lang] : d;
  }));
  return out;
}
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2200); }
let tierToken = 0;
async function setTierFilter(n) {
  const token = ++tierToken;
  if (n.size) toast('Cerco le carte…');
  const f = n.size ? await loadFiltered(n) : null;
  if (token !== tierToken) return;
  const prev = tierActive, prevPools = { ...fpools };
  tierActive = n;
  if (f) { for (const l in fpools) delete fpools[l]; Object.assign(fpools, f); }
  bag = null; updateCount();
  if (n.size && !total) { tierActive = prev; for (const l in fpools) delete fpools[l]; Object.assign(fpools, prevPools); bag = null; updateCount(); toast('Nessuna carta con questi filtri'); return; }
  try { localStorage.setItem('filtro-rarita', JSON.stringify([...tierActive])); } catch (e) {}
  rebuildBag(); renderTierFilters();
  if (n.size) $('toast').classList.remove('on');
  if (total) deal();
}
function renderTierFilters() {
  const f = $('tfilters');
  f.innerHTML = '';
  const mk = (cls, label, on, onClick) => {
    const b = document.createElement('button');
    b.className = 'tchip ' + cls + (on ? ' on' : '');
    b.textContent = label;
    b.addEventListener('click', onClick);
    f.appendChild(b);
  };
  mk('all', 'Tutte', !tierActive.size, () => setTierFilter(new Set()));
  for (const t in RARITIES) mk('r-' + t, TIER_LABELS[t], tierActive.has(t), () => {
    const n = new Set(tierActive);
    n.has(t) ? n.delete(t) : n.add(t);
    if (n.size === Object.keys(RARITIES).length) n.clear();
    setTierFilter(n);
  });
}

/* ---------- filtro lingua ---------- */
try { active = new Set(JSON.parse(localStorage.getItem('filtro-lingue')) || []); } catch (e) {}
function renderFilters() {
  const f = $('filters');
  f.innerHTML = '';
  const mk = (label, name, on, onClick, disabled) => {
    const b = document.createElement('button');
    b.className = 'chip' + (on ? ' on' : '');
    b.textContent = label; b.title = b.ariaLabel = name; b.disabled = !!disabled;
    b.addEventListener('click', onClick);
    f.appendChild(b);
  };
  mk('🌐', 'Tutte le lingue', !active.size, () => setFilter(new Set()));
  for (const l in LANGS) mk(FLAGS[l], LANG_NAMES[l], active.has(l), () => {
    const n = new Set(active);
    n.has(l) ? n.delete(l) : n.add(l);
    if (n.size === Object.keys(LANGS).length) n.clear(); // tutte scelte = "Tutte"
    setFilter(n);
  }, !pools[l]);
}
function setFilter(n) {
  active = n;
  try { localStorage.setItem('filtro-lingue', JSON.stringify([...active])); } catch (e) {}
  bag = null; rebuildBag();
  renderFilters(); updateCount();
  if (total) deal();
}


/* ---------- schermata iniziale ---------- */
document.body.classList.add('locked');
document.documentElement.classList.add('splashing');
function buildWall() {
  const wall = $('wall');
  const cols = Math.max(3, Math.min(6, Math.round(innerWidth / 130)));
  for (let c = 0; c < cols; c++) {
    const col = document.createElement('div');
    col.className = 'col';
    const list = [];
    let ready = 0;
    const mk = () => {
      const im = new Image(); im.alt = ''; im.decoding = 'async';
      const load = () => { im.src = img(pick(), 'low'); };
      im.onload = () => {
        im.classList.add('ok');
        // a carte tutte caricate, duplico la colonna per far girare l'animazione senza stacchi
        if (++ready === 8) for (const o of list) { const d = new Image(); d.alt = ''; d.src = o.src; d.className = 'ok'; col.appendChild(d); }
      };
      im.onerror = load; // immagine mancante → un'altra carta reale
      load();
      return im;
    };
    for (let k = 0; k < 8; k++) { const im = mk(); list.push(im); col.appendChild(im); }
    col.style.animationDelay = (-Math.random() * 20) + 's';
    wall.appendChild(col);
  }
}
const VERSION = 'v12';
$('logo').addEventListener('click', () => {
  const r = $('splash').getBoundingClientRect();
  const sb = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--full'));
  const probe = document.createElement('div'); probe.style.cssText = 'position:fixed;bottom:0;height:0;padding-bottom:env(safe-area-inset-bottom)';
  document.body.appendChild(probe); const safe = probe.offsetHeight; probe.remove();
  const h = $('hint'); h.style.display = 'block';
  h.textContent = `${VERSION} · standalone=${!!navigator.standalone} · inner=${innerWidth}x${innerHeight} · screen=${screen.width}x${screen.height} · full=${sb} · splash=${Math.round(r.height)} · safeBottom=${safe}`;
});
$('go').addEventListener('click', () => {
  $('splash').classList.add('hide'); document.documentElement.classList.remove('splashing');
  document.body.classList.remove('locked');
  setTimeout(() => $('splash').remove(), 450);
});

/* ---------- avvio ---------- */
function updateCount(loading) {
  total = activeLangs().reduce((s, l) => s + P()[l].length, 0);
}
renderFilters(); renderTierFilters();
btn.addEventListener('click', deal);

(async () => {
  let started = false, pending = Object.keys(LANGS).length, failed = 0;
  await Promise.all(Object.keys(LANGS).map(async lang => {
    try {
      pools[lang] = await loadLang(lang);
      bag = null; // ricostruisci l'estrazione includendo la nuova lingua
    } catch (e) { failed++; }
    pending--;
    updateCount(pending > 0);
    renderFilters();
  }));
  // distribuisci solo quando tutte le lingue sono arrivate, così la prima mano è davvero mista
  if (!total && active.size) { active = new Set(); updateCount(); renderFilters(); }
  if (tierActive.size && Object.keys(pools).length) {
    Object.assign(fpools, await loadFiltered(tierActive));
    updateCount();
    if (!total) { tierActive = new Set(); try { localStorage.removeItem('filtro-rarita'); } catch (e) {} bag = null; updateCount(); renderTierFilters(); }
  }
  if (total) { started = true; statusEl.remove(); btn.disabled = false; deal(); buildWall(); $('go').disabled = false; $('go').textContent = 'Scopri le carte'; }
  if (!started) { $('go').textContent = 'Errore di rete'; statusEl.textContent = 'Non riesco a caricare le carte. Controlla la connessione e riapri l’app.'; }
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
